<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="description" content="Aroma Restaurant — Delight Your Senses, Before Taste. Smart Digital Menu in Debre Berhan, Ethiopia."/>
<title>Aroma Restaurant | Smart Digital Menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:wght@300;400;500&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --primary:#1B3A12;--primary-dark:#0f2409;--secondary:#F5EDD8;--secondary-alt:#EDE0C4;
  --accent:#7DC52A;--accent-dark:#5EA01E;--gold:#C9A84C;--gold-dark:#B8860B;
  --surface:#FAFAF7;--text:#2C2C2C;--muted:#7A6F5E;--white:#FFFFFF;
  --shadow:0 4px 24px rgba(0,0,0,0.08);--shadow-h:0 12px 40px rgba(0,0,0,0.14);
  --r:16px;--pill:999px;--t:200ms ease-in-out;--tm:300ms ease-in-out;
  --fd:'Cormorant Garamond',Georgia,serif;--fb:'DM Sans',system-ui,sans-serif;--fp:'Poppins',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{font-family:var(--fb);background:var(--surface);color:var(--text);line-height:1.6;overflow-x:hidden;}
img{display:block;max-width:100%;object-fit:cover;}
button{cursor:pointer;border:none;background:none;font-family:inherit;}
ul{list-style:none;}
::-webkit-scrollbar{width:6px;height:6px;}
::-webkit-scrollbar-track{background:var(--secondary);}
::-webkit-scrollbar-thumb{background:var(--accent);border-radius:999px;}

/* HEADER */
.header{position:sticky;top:0;z-index:100;background:rgba(27,58,18,0.97);backdrop-filter:blur(12px);
  padding:0 32px;height:68px;display:flex;align-items:center;justify-content:space-between;
  box-shadow:0 2px 16px rgba(0,0,0,0.18);}
.logo{display:flex;align-items:center;gap:0;text-decoration:none;}
.logo-img{height:52px;width:auto;flex-shrink:0;}
.hcontrols{display:flex;align-items:center;gap:10px;}
.ctrl-wrap{position:relative;}
.ctrl-btn{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);
  border-radius:var(--pill);color:var(--white);font-size:.85rem;font-weight:500;padding:6px 14px;
  transition:background var(--t),border-color var(--t);white-space:nowrap;}
.ctrl-btn:hover,.ctrl-btn.open{background:rgba(125,197,42,0.18);border-color:var(--accent);}
.ctrl-btn .arr{font-size:.6rem;opacity:.7;transition:transform var(--t);display:inline-block;}
.ctrl-btn.open .arr{transform:rotate(180deg);}
.ddmenu{position:absolute;top:calc(100% + 8px);right:0;background:var(--white);border-radius:var(--r);
  box-shadow:0 8px 32px rgba(0,0,0,0.14);min-width:160px;overflow:hidden;
  opacity:0;transform:translateY(-8px) scale(.97);pointer-events:none;
  transition:opacity var(--tm),transform var(--tm);z-index:200;}
.ddmenu.open{opacity:1;transform:translateY(0) scale(1);pointer-events:all;}
.ddi{display:flex;align-items:center;gap:10px;padding:10px 16px;font-size:.88rem;cursor:pointer;transition:background var(--t);}
.ddi:hover{background:var(--secondary);}
.ddi.active{background:var(--secondary-alt);font-weight:600;color:var(--primary);}
.mbtn{display:none;align-items:center;gap:6px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);
  border-radius:var(--pill);color:var(--white);font-size:.85rem;padding:6px 14px;}

/* HERO */
.hero{position:relative;height:100vh;min-height:560px;overflow:hidden;display:flex;align-items:center;justify-content:center;}
.hero-bg{position:absolute;inset:0;background:url('https://images.unsplash.com/photo-1567620905732-2d1ec7ab7445?w=1600&q=80') center/cover;
  transform:scale(1.05);transition:transform 8s ease-out;}
.hero-bg.loaded{transform:scale(1);}
.hero-ov{position:absolute;inset:0;background:linear-gradient(to top,rgba(27,58,18,.88) 0%,rgba(27,58,18,.35) 50%,rgba(0,0,0,.15) 100%);}
.hero-c{position:relative;z-index:2;text-align:center;color:var(--white);padding:0 24px;animation:fadeUp 1s ease-out .3s both;}
@keyframes fadeUp{from{opacity:0;transform:translateY(28px);}to{opacity:1;transform:translateY(0);}}
.hero-tag{display:inline-block;background:rgba(201,168,76,.22);border:1px solid var(--accent);border-radius:var(--pill);
  color:var(--accent);font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;padding:5px 18px;margin-bottom:20px;}
.hero h1{font-family:var(--fd);font-size:clamp(2.2rem,6vw,4.5rem);font-weight:700;line-height:1.08;margin-bottom:16px;text-shadow:0 2px 16px rgba(0,0,0,.3);}
.hero p{font-size:clamp(1rem,2vw,1.22rem);font-weight:300;opacity:.88;margin-bottom:36px;letter-spacing:.02em;}
.hero-cta{display:inline-flex;align-items:center;gap:8px;border:2px solid var(--accent);color:var(--accent);border-radius:var(--pill);
  padding:14px 36px;font-family:var(--fp);font-size:.95rem;font-weight:600;letter-spacing:.05em;
  transition:background var(--t),color var(--t),transform var(--t);text-decoration:none;}
.hero-cta:hover{background:var(--accent);color:var(--primary-dark);transform:translateY(-2px);}

/* WRAPPER */
.wrap{max-width:1400px;margin:0 auto;padding:0 32px;}

/* SECTION */
.msec{padding:64px 0;}
.dsec{padding:64px 0;background:linear-gradient(180deg,var(--surface) 0%,var(--secondary) 100%);}
.sh{text-align:center;margin-bottom:48px;}
.slabel{font-size:.78rem;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:8px;}
.stitle{font-family:var(--fd);font-size:clamp(2rem,4vw,3rem);font-weight:700;color:var(--primary-dark);margin-bottom:12px;}
.sdiv{width:60px;height:3px;background:linear-gradient(90deg,var(--accent),var(--accent-dark));border-radius:999px;margin:0 auto;}

/* SEARCH */
.swrap{position:relative;max-width:560px;margin:0 auto 40px;}
.swrap svg{position:absolute;left:18px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted);pointer-events:none;transition:color var(--t);}
.sinput{width:100%;padding:14px 20px 14px 50px;border:2px solid var(--secondary-alt);border-radius:var(--pill);
  font-family:var(--fb);font-size:.95rem;background:var(--white);color:var(--text);box-shadow:var(--shadow);
  transition:border-color var(--tm),box-shadow var(--tm);outline:none;}
.sinput:focus{border-color:var(--primary);box-shadow:0 0 0 4px rgba(45,74,30,.1),var(--shadow);}
.swrap:focus-within svg{color:var(--primary);}

/* TABS */
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:40px;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab{flex-shrink:0;padding:8px 22px;border-radius:var(--pill);border:2px solid var(--secondary-alt);background:transparent;
  color:var(--muted);font-size:.9rem;font-weight:500;transition:all var(--t);white-space:nowrap;}
.tab:hover{border-color:var(--primary);color:var(--primary);}
.tab.active{background:var(--primary);border-color:var(--primary);color:var(--secondary);}
.stab{flex-shrink:0;padding:6px 18px;border-radius:var(--pill);border:1.5px solid var(--secondary-alt);background:transparent;
  color:var(--muted);font-size:.85rem;font-weight:500;transition:all var(--t);}
.stab:hover{border-color:var(--accent);color:var(--accent-dark);}
.stab.active{background:var(--accent);border-color:var(--accent);color:var(--white);}

/* LAYOUT */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:28px;}

/* CARD */
.card{background:var(--white);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);
  transition:transform var(--tm),box-shadow var(--tm);cursor:pointer;position:relative;}
.card:hover{transform:translateY(-6px);box-shadow:var(--shadow-h);}
.card:hover .cimg img{transform:scale(1.07);}
.cimg{position:relative;overflow:hidden;aspect-ratio:16/9;}
.cimg img{width:100%;height:100%;object-fit:cover;transition:transform 400ms ease-in-out;}
.badge{position:absolute;top:12px;left:12px;border-radius:var(--pill);padding:4px 12px;
  font-family:var(--fp);font-size:.72rem;font-weight:600;display:flex;align-items:center;gap:4px;letter-spacing:.04em;}
.badge-pop{background:rgba(184,134,11,.92);color:#fff;}
.badge-new{background:rgba(192,57,43,.9);color:#fff;}
.badge-spc{background:rgba(45,74,30,.9);color:#fff;}
.cbody{padding:20px;}
.cname{font-family:var(--fd);font-size:1.18rem;font-weight:600;color:var(--primary-dark);margin-bottom:6px;}
.cdesc{font-size:.85rem;color:var(--muted);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:16px;}
.cfoot{display:flex;align-items:center;justify-content:space-between;}
.price{background:linear-gradient(135deg,var(--gold),var(--gold-dark));color:var(--white);
  font-family:var(--fp);font-size:.9rem;font-weight:600;padding:5px 14px;border-radius:var(--pill);}
.addbtn{width:40px;height:40px;background:var(--primary);color:var(--white);border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:1.3rem;font-weight:300;
  transition:background var(--t),transform var(--t);}
.addbtn:hover{background:var(--accent-dark);}
.addbtn.pulse{animation:pulse .4s ease-out;}
@keyframes pulse{0%{transform:scale(1);}50%{transform:scale(1.4);}100%{transform:scale(1);}}

/* QR FAB (mobile only) */
.qrwrap{width:140px;height:140px;margin:0 auto 16px;border-radius:12px;border:4px solid var(--accent);
  padding:6px;background:var(--white);display:flex;align-items:center;justify-content:center;overflow:hidden;}
.qrwrap svg{width:100%;height:100%;}
.qtable{display:inline-flex;align-items:center;gap:6px;background:var(--primary);color:var(--white);
  border-radius:var(--pill);padding:4px 14px;font-family:var(--fp);font-size:.8rem;font-weight:600;margin-bottom:12px;}
.qrtitle{font-family:var(--fd);font-size:1.05rem;font-weight:700;color:var(--primary-dark);margin-bottom:4px;}
.qrsub{font-size:.75rem;color:var(--muted);margin-bottom:16px;}
.qnote{font-size:.75rem;color:var(--muted);line-height:1.5;}
.qrfab{display:none;position:fixed;bottom:80px;right:20px;width:52px;height:52px;background:var(--primary);
  color:var(--white);border-radius:50%;font-size:1.3rem;align-items:center;justify-content:center;
  box-shadow:0 4px 20px rgba(0,0,0,.25);z-index:90;transition:transform var(--t);}
.qrfab:hover{transform:scale(1.1);}

/* DETAIL MODAL */
.moverlay{display:none;position:fixed;inset:0;z-index:300;align-items:flex-end;justify-content:center;}
.moverlay.open{display:flex;animation:mfade .2s ease-out;}
@keyframes mfade{from{opacity:0;}to{opacity:1;}}
.mbk{position:absolute;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);cursor:pointer;}
.mdialog{position:relative;background:var(--white);width:100%;max-width:680px;max-height:90vh;
  border-radius:24px 24px 0 0;overflow-y:auto;animation:mup .3s cubic-bezier(.32,1,.23,1);}
@media(min-width:769px){
  .moverlay{align-items:center;}
  .mdialog{border-radius:24px;max-height:88vh;margin:16px;}
  @keyframes mup{from{opacity:0;transform:scale(.94) translateY(20px);}to{opacity:1;transform:none;}}
}
@media(max-width:768px){
  @keyframes mup{from{transform:translateY(100%);}to{transform:translateY(0);}}
}
.mimg{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;flex-shrink:0;}
.mimg img{width:100%;height:100%;object-fit:cover;display:block;}
.mimg-grad{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.5) 0%,transparent 60%);}
.mbadge-wrap{position:absolute;top:14px;left:14px;display:flex;gap:6px;flex-wrap:wrap;}
.mclose{position:absolute;top:14px;right:14px;width:36px;height:36px;background:rgba(0,0,0,.5);
  color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1rem;
  backdrop-filter:blur(4px);transition:background var(--t);z-index:2;}
.mclose:hover{background:rgba(0,0,0,.75);}
.mbody{padding:24px;}
.mname{font-family:var(--fd);font-size:1.7rem;font-weight:700;color:var(--primary);margin-bottom:4px;}
.mmeta{display:flex;gap:12px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin-bottom:14px;}
.mmeta span{display:flex;align-items:center;gap:4px;}
.mfullesc{font-size:.92rem;color:var(--text);line-height:1.65;margin-bottom:20px;}
.msec-title{font-size:.72rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  color:var(--accent-dark);margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--secondary-alt);}
.mingredients{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px;}
.mingred-tag{background:var(--secondary);border:1px solid var(--secondary-alt);border-radius:var(--pill);
  padding:3px 12px;font-size:.8rem;color:var(--text);}
.mallergens{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;}
.mallergen{display:flex;align-items:center;gap:5px;font-size:.82rem;color:var(--muted);}
.mnutri{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:20px;}
.mnutri-item{background:var(--secondary);border-radius:12px;padding:10px 8px;text-align:center;}
.mnutri-val{font-family:var(--fp);font-size:1.1rem;font-weight:700;color:var(--primary);}
.mnutri-lbl{font-size:.7rem;color:var(--muted);margin-top:2px;}
.mfooter{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  padding-top:16px;border-top:1px solid var(--secondary-alt);}
.mprice{font-family:var(--fp);font-size:1.5rem;font-weight:700;color:var(--primary);}
.mprice small{font-size:.7rem;font-weight:400;color:var(--muted);display:block;}
.mqty{display:flex;align-items:center;gap:0;border:2px solid var(--secondary-alt);border-radius:var(--pill);overflow:hidden;}
.mqty-btn{width:36px;height:36px;font-size:1.1rem;color:var(--primary);font-weight:700;
  transition:background var(--t);display:flex;align-items:center;justify-content:center;}
.mqty-btn:hover{background:var(--secondary);}
.mqty-num{width:36px;text-align:center;font-family:var(--fp);font-size:.95rem;font-weight:600;color:var(--primary);}
.madd{display:flex;align-items:center;gap:8px;background:var(--primary);color:#fff;
  border-radius:var(--pill);padding:10px 24px;font-family:var(--fp);font-size:.9rem;font-weight:600;
  transition:background var(--t),transform var(--t);}
.madd:hover{background:var(--accent-dark);transform:translateY(-1px);}
.card{position:relative;}
.card .hover-hint{position:absolute;inset:0;background:rgba(0,0,0,0);border-radius:var(--r);
  display:flex;align-items:center;justify-content:center;opacity:0;transition:all var(--tm);pointer-events:none;}
.card:hover .hover-hint{background:rgba(0,0,0,.1);opacity:1;}
.hover-hint span{background:rgba(27,58,18,.82);color:#fff;padding:6px 18px;border-radius:var(--pill);
  font-size:.78rem;font-weight:600;letter-spacing:.04em;backdrop-filter:blur(4px);}

/* DRINKS DIVIDER */
.ddiv{display:flex;align-items:center;gap:16px;margin-bottom:48px;}
.ddiv::before,.ddiv::after{content:'';flex:1;height:1px;background:var(--secondary-alt);}
.ddivtxt{font-family:var(--fd);font-size:1.5rem;font-weight:600;color:var(--muted);white-space:nowrap;}

/* MODAL / SHEET */
.overlay{display:none;position:fixed;inset:0;z-index:200;}
.overlay.open{display:flex;align-items:flex-end;}
.obk{position:absolute;inset:0;background:rgba(0,0,0,.4);backdrop-filter:blur(2px);}
.sheet{position:relative;background:var(--white);border-radius:24px 24px 0 0;padding:32px 24px 48px;width:100%;animation:sup 300ms ease-out;}
.sheet.cream{background:var(--secondary);}
@keyframes sup{from{transform:translateY(100%);}to{transform:translateY(0);}}
.handle{width:40px;height:4px;background:var(--secondary-alt);border-radius:999px;margin:0 auto 20px;}
.sclose{position:absolute;top:16px;right:16px;width:32px;height:32px;background:var(--secondary-alt);
  border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.9rem;}
.stitle{font-family:var(--fd);font-size:1.4rem;font-weight:700;color:var(--primary-dark);margin-bottom:20px;}
.sglabel{font-size:.75rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;}
.sopts{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px;}
.sopt{display:flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--pill);
  border:2px solid var(--secondary-alt);font-size:.88rem;color:var(--text);transition:all var(--t);}
.sopt:hover{border-color:var(--primary);}
.sopt.active{background:var(--primary);border-color:var(--primary);color:var(--white);}

/* BOTTOM NAV */
.bnav{display:none;position:fixed;bottom:0;left:0;right:0;background:rgba(27,58,18,.97);
  backdrop-filter:blur(12px);z-index:100;box-shadow:0 -2px 16px rgba(0,0,0,.18);}
.bnavin{display:flex;justify-content:space-around;align-items:center;padding:8px 0 12px;}
.ni{display:flex;flex-direction:column;align-items:center;gap:3px;color:rgba(255,255,255,.5);
  font-size:.65rem;font-weight:500;padding:4px 12px;min-width:48px;min-height:48px;justify-content:center;
  border-radius:8px;transition:color var(--t);text-decoration:none;}
.ni .icon{font-size:1.3rem;}
.ni.active{color:var(--accent);}
.ni:hover{color:#fff;}

/* EMPTY */
.empty{text-align:center;padding:64px 24px;grid-column:1/-1;}
.empty .ei{font-size:3rem;margin-bottom:16px;}
.empty h3{font-family:var(--fd);font-size:1.5rem;color:var(--muted);margin-bottom:8px;}
.empty p{font-size:.9rem;color:var(--muted);opacity:.7;}

/* FOOTER */
.footer{background:var(--primary-dark);color:var(--secondary);padding:48px 32px 96px;text-align:center;}
.fw{font-family:var(--fd);font-size:1.8rem;font-weight:700;color:var(--accent);margin-bottom:4px;}
.footer-logo{height:56px;width:auto;background:#fff;border-radius:10px;padding:4px 10px;margin:0 auto 12px;display:block;}
.fdiv{width:40px;height:2px;background:var(--accent);border-radius:999px;margin:16px auto;opacity:.5;}

/* RATES */
.rates{text-align:center;font-size:.75rem;color:var(--muted);padding:16px 0 0;opacity:.7;}

/* PRICE FLIP */
.price{display:inline-block;perspective:300px;}
.flip{animation:flip .3s ease-in-out;}
@keyframes flip{0%{transform:rotateX(0);opacity:1;}50%{transform:rotateX(90deg);opacity:0;}100%{transform:rotateX(0);opacity:1;}}

/* RTL */
[dir=rtl] .hcontrols{flex-direction:row-reverse;}
[dir=rtl] .swrap svg{left:auto;right:18px;}
[dir=rtl] .sinput{padding:14px 50px 14px 20px;}
[dir=rtl] .badge{left:auto;right:12px;}
[dir=rtl] .ddmenu{right:auto;left:0;}

/* RESPONSIVE */
@media(max-width:1100px){.qrfab{display:flex;}}
@media(max-width:768px){
  .header{padding:0 16px;height:60px;}
  .hcontrols .ctrl-wrap{display:none;}
  .mbtn{display:flex;}
  .hero{height:60vh;}
  .wrap{padding:0 16px;}
  .grid{grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;}
  .bnav{display:block;}
  .msec,.dsec{padding:40px 0;}
  .footer{padding-bottom:110px;}
}
@media(max-width:480px){.grid{grid-template-columns:1fr;}}
</style>
</head>
<body>
<div id="app"></div>

<script>
// ─── DATA ────────────────────────────────────────────────────
const cats = ['All','Breakfast','Lunch','Dinner','Drinks','Specials'];
const dsubcats = ['Hot Drinks','Cold Drinks','Fresh Juices','Smoothies','Soft Drinks','Alcohol'];

const langs = [
  {code:'en',label:'EN',full:'English',flag:'🇬🇧',dir:'ltr'},
  {code:'am',label:'አማ',full:'አማርኛ',flag:'🇪🇹',dir:'ltr'},
  {code:'om',label:'OM',full:'Oromiffa',flag:'🇪🇹',dir:'ltr'},
  {code:'ti',label:'TI',full:'ትግርኛ',flag:'🇪🇹',dir:'ltr'},
  {code:'ar',label:'AR',full:'العربية',flag:'🇸🇦',dir:'rtl'},
  {code:'fr',label:'FR',full:'Français',flag:'🇫🇷',dir:'ltr'},
  {code:'zh',label:'中文',full:'中文',flag:'🇨🇳',dir:'ltr'},
];

const curs = [
  {code:'ETB',sym:'Br',rate:1,   fmt:n=>`${n} Br`},
  {code:'USD',sym:'$', rate:.00701,fmt:n=>`$${n}`},
  {code:'EUR',sym:'€', rate:.00641,fmt:n=>`€${n}`},
  {code:'CNY',sym:'¥', rate:.05078,fmt:n=>`¥${n}`},
  {code:'SAR',sym:'ر.س',rate:.02629,fmt:n=>`ر.س ${n}`},
];

// ─── RENDER PARTS ────────────────────────────────────────────
function badge(item){
  if(!item.badge)return '';
  const cls=item.badge==='popular'?'badge-pop':item.badge==='new'?'badge-new':'badge-spc';
  const lbl=item.badge==='popular'?'Popular':item.badge==='new'?'New':"Chef's Special";
  return `<div class="badge ${cls}">${item.bi} ${lbl}</div>`;
}

function card(item){
  return `<article class="card" tabindex="0" role="button"
    aria-label="${txt(item.name)} — ${t('viewdet')}"
    onclick="openModal(${item.id})"
    onkeydown="if(event.key==='Enter')openModal(${item.id})">
    <div class="cimg"><img src="${item.img}" alt="${txt(item.name)}" loading="lazy"/>${badge(item)}</div>
    <div class="cbody">
      <h3 class="cname">${txt(item.name)}</h3>
      <p class="cdesc">${txt(item.desc)}</p>
      <div class="cfoot">
        <span class="price" data-etb="${item.price}">${fp(item.price)}</span>
        <button class="addbtn" data-id="${item.id}" title="${t('add')}" onclick="event.stopPropagation()">+</button>
      </div>
    </div>
    <div class="hover-hint"><span>${t('viewdet')} →</span></div>
  </article>`;
}

function renderModal(item){
  if(!item)return '';
  const allergenHtml = item.allergens?.length
    ? item.allergens.map(a=>`<span class="mallergen">${a.icon} ${a.name}</span>`).join('')
    : `<span class="mallergen" style="opacity:.5">None listed</span>`;
  const n = item.nutrition||{};
  return `<div class="moverlay open" id="moverlay">
    <div class="mbk" id="mbk"></div>
    <div class="mdialog" role="dialog" aria-modal="true" aria-label="${txt(item.name)}">
      <div class="mimg">
        <img src="${item.img}" alt="${txt(item.name)}"/>
        <div class="mimg-grad"></div>
        <div class="mbadge-wrap">${badge(item)}</div>
        <button class="mclose" id="mclose" aria-label="${t('close')}">&#10005;</button>
      </div>
      <div class="mbody">
        <h2 class="mname">${txt(item.name)}</h2>
        <div class="mmeta">
          <span>📂 ${item.cat||item.sub}</span>
          ${item.prepTime?`<span>⏱ ${item.prepTime} min</span>`:''}
          ${n.calories?`<span>🔥 ${n.calories} kcal</span>`:''}
        </div>
        <p class="mfullesc">${txt(item.desc)}</p>
        ${item.ingredients?.length?`
        <p class="msec-title">${t('ingr')}</p>
        <div class="mingredients">${item.ingredients.map(i=>`<span class="mingred-tag">${i}</span>`).join('')}</div>`:''}
        ${item.allergens!==undefined?`
        <p class="msec-title">${t('aller')}</p>
        <div class="mallergens">${allergenHtml}</div>`:''}
        ${n.calories?`
        <p class="msec-title">${t('nutri')}</p>
        <div class="mnutri">
          <div class="mnutri-item"><div class="mnutri-val">${n.calories}</div><div class="mnutri-lbl">kcal</div></div>
          <div class="mnutri-item"><div class="mnutri-val">${n.protein}g</div><div class="mnutri-lbl">Protein</div></div>
          <div class="mnutri-item"><div class="mnutri-val">${n.carbs}g</div><div class="mnutri-lbl">Carbs</div></div>
          <div class="mnutri-item"><div class="mnutri-val">${n.fat}g</div><div class="mnutri-lbl">Fat</div></div>
        </div>`:''}
        <div class="mfooter">
          <div class="mprice">${fp(item.price)}<small>${S.cur.code} · per serving</small></div>
          <div style="display:flex;gap:10px;align-items:center">
            <div class="mqty">
              <button class="mqty-btn" id="mdec">−</button>
              <span class="mqty-num" id="mqn">${S.qty}</span>
              <button class="mqty-btn" id="minc">+</button>
            </div>
            <button class="madd" id="madd">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              ${t('add')}
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>`;
}

function openModal(id){
  const all=[...food,...drinks];
  S.modal=all.find(i=>i.id===id)||null;
  S.qty=1;
  if(!S.modal)return;
  // inject modal into DOM without full re-render
  let mEl=$('#moverlay');
  if(!mEl){const d=document.createElement('div');document.getElementById('app').appendChild(d);mEl=d;}
  mEl.outerHTML=renderModal(S.modal);
  document.body.style.overflow='hidden';
  bindModal();
}

function closeModal(){
  const mEl=$('#moverlay');
  if(mEl)mEl.remove();
  S.modal=null;S.qty=1;
  document.body.style.overflow='';
}

function bindModal(){
  $('#mbk')?.addEventListener('click',closeModal);
  $('#mclose')?.addEventListener('click',closeModal);
  $('#mdec')?.addEventListener('click',()=>{if(S.qty>1){S.qty--;$('#mqn').textContent=S.qty;}});
  $('#minc')?.addEventListener('click',()=>{S.qty++;$('#mqn').textContent=S.qty;});
  $('#madd')?.addEventListener('click',e=>{
    const btn=e.currentTarget;btn.style.background='var(--accent-dark)';
    setTimeout(()=>{btn.style.background='';},400);
  });
}

// expose globally for inline onclick
window.openModal=openModal;

function qrBlock(){
  return `<div style="text-align:center;padding:8px 0">
    <p class="qrtitle">Fancy Aroma <span style="font-family:var(--fb);font-size:.75rem;color:var(--accent);display:block">ፋንሲ አሮማ</span></p>
    <p class="qrsub">${t('qtsub')}</p>
    <div class="qrwrap">${QR}</div>
    <div class="qtable">📋 Table 7</div>
    <p class="qnote">${t('qtnote')}</p>
  </div>`;
}

function filterFood(){
  const q=S.q.toLowerCase();
  return food.filter(i=>(S.cat==='All'||i.cat===S.cat)&&(!q||txt(i.name).toLowerCase().includes(q)||txt(i.desc).toLowerCase().includes(q)));
}
function filterDrinks(){
  const q=S.q.toLowerCase();
  return drinks.filter(i=>i.sub===S.dsub&&(!q||txt(i.name).toLowerCase().includes(q)));
}

function emptyState(icon,title,sub){
  return `<div class="empty"><div class="ei">${icon}</div><h3>${title}</h3><p>${sub}</p></div>`;
}

// ─── PARTIAL UPDATES ─────────────────────────────────────────
function updFood(){
  const g=$('#fgrid'); if(!g)return;
  const fl=filterFood();
  g.innerHTML=fl.length?fl.map(card).join(''):emptyState('🍽️',t('nr'),t('nrs'));
}
function updDrinks(){
  const g=$('#dgrid'); if(!g)return;
  const dl=filterDrinks();
  g.innerHTML=dl.length?dl.map(card).join(''):emptyState('🍵',t('nr'),t('nrs'));
}
function animPrices(){
  $$('.price').forEach(el=>{
    const etb=parseFloat(el.dataset.etb);
    el.classList.add('flip');
    el.addEventListener('animationend',()=>{el.textContent=fp(etb);el.classList.remove('flip');},{once:true});
  });
}

// ─── EVENTS ──────────────────────────────────────────────────
function bind(){
  // Language dropdown
  $('#lbtn')?.addEventListener('click',e=>{e.stopPropagation();S.lOpen=!S.lOpen;S.cOpen=false;
    $('#lbtn').classList.toggle('open',S.lOpen);$('#lmenu').classList.toggle('open',S.lOpen);
    $('#cbtn')?.classList.remove('open');$('#cmenu')?.classList.remove('open');});
  $$('#lmenu .ddi').forEach(d=>d.addEventListener('click',()=>{S.lang=d.dataset.l;closeDD();render();}));

  // Currency dropdown
  $('#cbtn')?.addEventListener('click',e=>{e.stopPropagation();S.cOpen=!S.cOpen;S.lOpen=false;
    $('#cbtn').classList.toggle('open',S.cOpen);$('#cmenu').classList.toggle('open',S.cOpen);
    $('#lbtn')?.classList.remove('open');$('#lmenu')?.classList.remove('open');});
  $$('#cmenu .ddi').forEach(d=>d.addEventListener('click',()=>{S.cur=curs.find(c=>c.code===d.dataset.c);closeDD();animPrices();}));

  document.addEventListener('click',()=>closeDD());

  // Search
  $('#si')?.addEventListener('input',e=>{S.q=e.target.value;updFood();updDrinks();});

  // Cat tabs
  $('#ctabs')?.addEventListener('click',e=>{
    const b=e.target.closest('.tab'); if(!b)return;
    S.cat=b.dataset.cat;
    $$('.tab').forEach(t=>t.classList.toggle('active',t.dataset.cat===S.cat));
    updFood();
  });

  // Drink sub tabs
  $('#dtabs')?.addEventListener('click',e=>{
    const b=e.target.closest('.stab'); if(!b)return;
    S.dsub=b.dataset.ds;
    $$('.stab').forEach(t=>t.classList.toggle('active',t.dataset.ds===S.dsub));
    updDrinks();
  });

  // Add buttons: pulse
  document.addEventListener('click',e=>{
    const b=e.target.closest('.addbtn'); if(!b)return;
    b.classList.remove('pulse'); void b.offsetWidth; b.classList.add('pulse');
    b.addEventListener('animationend',()=>b.classList.remove('pulse'),{once:true});
  });

  // QR
  ['#qrfab','#bnqr'].forEach(id=>$(id)?.addEventListener('click',()=>{S.qrOpen=true;render();}));
  $('#qrbk')?.addEventListener('click',()=>{S.qrOpen=false;render();});

  // Settings
  ['#sbtn','#bnset'].forEach(id=>$(id)?.addEventListener('click',()=>{S.setOpen=true;render();}));
  $('#setbk')?.addEventListener('click',()=>{S.setOpen=false;render();});
  $('#setcl')?.addEventListener('click',()=>{S.setOpen=false;render();});
  $$('.sopt[data-sl]').forEach(b=>b.addEventListener('click',()=>{S.lang=b.dataset.sl;S.setOpen=false;render();}));
  $$('.sopt[data-sc]').forEach(b=>b.addEventListener('click',()=>{S.cur=curs.find(c=>c.code===b.dataset.sc);S.setOpen=false;animPrices();}));

  // Escape closes modal too
  document.addEventListener('keydown',e=>{
    if(e.key!=='Escape'){
      if(S.qrOpen){S.qrOpen=false;render();}
      else if(S.setOpen){S.setOpen=false;render();}
    } else {
      if($('#moverlay')){closeModal();return;}
      if(S.qrOpen){S.qrOpen=false;render();}
      else if(S.setOpen){S.setOpen=false;render();}
    }
  });
}

render();
</script>
